<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eqwal Ability</title>
  <meta name="description" content="Eqwal Ability ontwikkelt op maat gemaakte orthopedische productconfiguratoren: Cheneau korset, AFO, custom seating en custom mattress.">
  <link rel="icon" type="image/png" href="images/bedrijfslogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html">
        <img class="site-header__logo" src="images/bedrijfslogo.png" alt="Eqwal Ability">
      </a>
    </div>
  </header>

  <main class="home-main">
    <section class="product-grid" aria-label="Producten">

      <a class="product-card" href="Cheneau.html">
        <span class="product-card__image-wrap">
          <img class="product-card__image" src="images/afbeelding1.png" alt="Cheneau" loading="lazy">
        </span>
        <span class="product-card__label">Cheneau</span>
      </a>

      <a class="product-card" href="AFO.html">
        <span class="product-card__image-wrap">
          <img class="product-card__image" src="images/afbeelding2.png" alt="AFO" loading="lazy">
        </span>
        <span class="product-card__label">AFO</span>
      </a>

      <a class="product-card" href="CustomSeating.html">
        <span class="product-card__image-wrap">
          <img class="product-card__image" src="images/afbeelding3.png" alt="Custom seating" loading="lazy">
        </span>
        <span class="product-card__label">Custom seating</span>
      </a>

      <a class="product-card" href="CustomMattress.html">
        <span class="product-card__image-wrap">
          <img class="product-card__image" src="images/afbeelding4.png" alt="Custom mattress" loading="lazy">
        </span>
        <span class="product-card__label">Custom mattress</span>
      </a>

    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__text">
        Product configurator developped by Eqwal Ability Belgium. <br>
        Questions or concerns? Contact us through <a href="mailto:rd@eqwal.be">rd@eqwal.be</a>.
      </p>
    </div>
    <img class="site-footer__mark" src="images/eq-logo-wit.png" alt="" aria-hidden="true">
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
